[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greynoc-cryptoscan"
version = "0.1.0"
description = "GreyNOC CryptoScan — Cryptographic Posture Management & PQC migration scanner (CBOM generator)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary — GreyNOC" }
authors = [{ name = "GreyNOC" }]
keywords = ["pqc", "post-quantum", "cbom", "cyclonedx", "cryptography", "security", "sbom"]
dependencies = [
    "cryptography>=42",
]

[project.optional-dependencies]
validation = ["cyclonedx-python-lib[json-validation]>=8"]

[project.scripts]
cryptoscan = "cryptoscan.cli:main"

[tool.setuptools]
packages = ["cryptoscan"]
