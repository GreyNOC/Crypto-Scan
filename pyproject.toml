[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greynoc-cryptoscan"
version = "0.2.2"
description = "GreyNOC CryptoScan — Cryptographic Posture Management & PQC migration scanner (CBOM + Mosca risk engine)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary — GreyNOC" }
authors = [{ name = "GreyNOC" }]
keywords = ["pqc", "post-quantum", "cbom", "cyclonedx", "cryptography", "security", "sbom"]
dependencies = [
    "cryptography>=42",
]

[project.optional-dependencies]
validation = ["cyclonedx-python-lib[json-validation]>=8", "jsonschema>=4"]

[project.scripts]
cryptoscan = "cryptoscan.cli:main"
gscan = "cryptoscan.cli:main"
gs = "cryptoscan.cli:main"

[tool.setuptools]
packages = ["cryptoscan"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Tests import modules next to the section that uses them, for readability.
"tests/*" = ["E402"]
