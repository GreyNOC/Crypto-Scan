name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }} · py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run tests
        run: python -m pytest -q tests/

      - name: Smoke-test CLI against the sample target
        run: |
          python -m cryptoscan.cli code ./sample-target \
            --cbom cbom.json --report report.md --json findings.json \
            --fail-on none

      - name: Assert locators are OS-independent (reproducibility)
        run: |
          python - <<'PY'
          import json
          locs = [f["locator"] for f in json.load(open("findings.json"))["findings"]]
          bad = [l for l in locs if "\\" in l]
          assert not bad, f"non-portable locators: {bad}"
          print(f"OK — {len(locs)} portable locators")
          PY
