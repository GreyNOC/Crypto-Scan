name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }} · py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation]"
          python -m pip install pytest

      - name: Run tests
        run: python -m pytest -q tests/

      - name: Smoke-test CLI (all outputs + Mosca) against the sample target
        run: |
          python -m cryptoscan.cli code ./sample-target \
            --cbom cbom.json --report report.md --json findings.json \
            --sarif out.sarif --mosca --fail-on none

      - name: Validate the CBOM against the CycloneDX 1.6 strict schema
        run: |
          python - <<'PY'
          import json
          from cyclonedx.validation.json import JsonStrictValidator
          from cyclonedx.schema import SchemaVersion
          errs = JsonStrictValidator(SchemaVersion.V1_6).validate_str(
              open("cbom.json", encoding="utf-8").read())
          assert errs is None, errs
          print("CBOM is CycloneDX 1.6 strict-valid")
          PY

      - name: Posture diff round-trips (assurance layer)
        run: |
          python -m cryptoscan.cli diff findings.json findings.json --json diff.json
          python - <<'PY'
          import json
          d = json.load(open("diff.json"))
          assert d["verdict"] == "NO_CHANGE", d["verdict"]
          print("diff self-compare -> NO_CHANGE")
          PY

      - name: Assert locators are OS-independent (reproducibility)
        run: |
          python - <<'PY'
          import json
          locs = [f["locator"] for f in json.load(open("findings.json"))["findings"]]
          bad = [l for l in locs if "\\" in l]
          assert not bad, f"non-portable locators: {bad}"
          print(f"OK — {len(locs)} portable locators")
          PY
